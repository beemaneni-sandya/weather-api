spring.application.name=weather-api

# Server
server.port=9090

# Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms

# OpenWeatherMap API config (set to mock for demo)
weather.api.url=https://api.openweathermap.org/data/2.5/weather
weather.api.key=mock
weather.api.mock=true

# Logging
logging.level.com.example.Weather_API=DEBUG